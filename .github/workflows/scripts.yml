name: Windows script checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Parse scripts and exercise launcher fixtures
        shell: ${{ matrix.shell }}
        run: ./tests/Test-Scripts.ps1
